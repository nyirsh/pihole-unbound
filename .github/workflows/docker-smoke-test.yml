
name: Docker Smoke Test

on:
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - pihole-unbound/**
      - .github/workflows/docker-smoke-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Unbound configuration
        run: |
          docker build -t pihole-unbound:test \
            -f Dockerfile ./pihole-unbound

          docker run --rm \
            --entrypoint unbound-checkconf \
            pihole-unbound:test

      - name: Start container
        run: |
          docker run -d \
            --name pihole-unbound-test \
            -e TZ=UTC \
            -e FTLCONF_webserver_api_password=testpassword \
            -e FTLCONF_dns_upstreams=127.0.0.1#5335 \
            -e FTLCONF_dns_listeningMode=all \
            pihole-unbound:test

      - name: Wait for healthy container
        run: |
          for i in $(seq 1 60); do
            STATUS=$(docker inspect \
              --format '{{.State.Health.Status}}' \
              pihole-unbound-test)

            echo "Health status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              docker logs pihole-unbound-test
              exit 1
            fi

            sleep 5
          done

          docker logs pihole-unbound-test
          exit 1

      - name: Test DNS resolution
        run: |
          docker exec pihole-unbound-test \
            dig @127.0.0.1 -p 5335 example.com \
            +time=5 +tries=2 +short

          docker exec pihole-unbound-test \
            dig @127.0.0.1 example.com \
            +time=5 +tries=2 +short

      - name: Cleanup
        if: always()
        run: |
          docker logs pihole-unbound-test || true
          docker rm -f pihole-unbound-test || true
